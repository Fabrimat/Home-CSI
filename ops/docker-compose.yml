# Home CSI — primary production deployment.
#
# Usage (from repo root):
#   cd ops
#   cp .env.example .env                          # then fill in real values
#   cp config.production.example.yaml config.yaml # then fill in per-node PSKs
#   chmod 600 config.yaml
#   docker compose up -d
#   docker compose run --rm migrate ...  (one-shot; `migrate` exits after
#     running, so `exec` into it fails with "no such container is running" —
#     see the `migrate` service below. `up -d` already runs it once
#     automatically; `run --rm` is for re-running it later, e.g. after an
#     upgrade.)
#
# See docs/deployment.md for the full step-by-step runbook, including where
# `config.yaml` and its per-node PSKs come from and how it differs from
# server/packages/config/config.example.yaml (which uses host-relative
# paths that don't exist inside these containers).
#
# Topology:
#   Internet ---80/443---> caddy ---http---> api (internal only)
#   Internet ---UDP--------------------------------> ingest (internal + published)
#   timescaledb is reachable ONLY on the internal `homecsi` network - never published
#   to the host, per the deployment's threat model (see docs/deployment.md).
#
# `migrate` is a one-shot job: it must complete successfully before `ingest`
# and `api` start, so their `depends_on` uses `service_completed_successfully`
# (not just "started") to avoid a race against an empty/half-migrated schema.
#
# Every service below sets `deploy.resources.limits` (cpus/memory). This is
# a Swarm-originated key, but `docker compose up`'s Compose V2 CLI (the
# `docker-compose-plugin`, not the legacy Python `docker-compose` v1) DOES
# apply `deploy.resources.limits` and `deploy.restart_policy` as plain
# container resource constraints even outside Swarm mode - it's only the
# *other* `deploy` sub-keys (`replicas`, `placement`, `update_config`, ...)
# that require Swarm and are silently ignored by `docker compose up`. This
# is why a small shared VPS can rely on these limits without running
# `docker stack deploy`.

x-app-env: &app-env
  NODE_ENV: production
  # These names are exactly the HOMECSI_* overrides read by
  # server/packages/config/src/env.ts's `ENV_VAR_PATHS` — verified against
  # that file, not assumed. A drift test
  # (server/packages/config/src/opsEnvDrift.test.ts) parses this anchor and
  # fails the build if a name here is ever not in `ENV_VAR_PATHS` or the
  # test's justified allowlist, so this comment cannot silently go stale
  # again the way the previous "ASSUMPTION" version of it did.
  #
  # `nodes:` (the per-node PSK registry) and `logging.file.path` have no
  # env override at all — see config.production.example.yaml's header for
  # why a real config.yaml is mandatory regardless of how many of these are
  # set. HOMECSI_CONFIG_PATH itself is not one of env.ts's config-value
  # overrides; it's the CLI's own config *file* resolution variable (see
  # packages/cli/src/resolveConfigPath.ts) — it has to be set here (rather
  # than relying on the `./config.yaml`-relative-to-cwd default) because
  # every service's WORKDIR is /app, not wherever config.yaml is mounted.
  HOMECSI_CONFIG_PATH: /etc/homecsi/config.yaml
  HOMECSI_SERVER_UDP_PORT: ${HOMECSI_UDP_PORT:-5566}
  HOMECSI_SERVER_HTTP_PORT: "8080"
  HOMECSI_SERVER_API_TOKEN: ${HOMECSI_SERVER_API_TOKEN}
  HOMECSI_DATABASE_HOST: timescaledb
  HOMECSI_DATABASE_PORT: "5432"
  HOMECSI_DATABASE_NAME: ${POSTGRES_DB}
  HOMECSI_DATABASE_USER: ${POSTGRES_USER}
  HOMECSI_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
  HOMECSI_LOGGING_LEVEL: ${HOMECSI_LOGGING_LEVEL:-info}

# Read-only bind mount of the operator's filled-in config.yaml (see the
# header comment above and config.production.example.yaml) into every
# service that runs the CLI. Never baked into the image (ops/Dockerfile
# never COPYs it, and ops/Dockerfile.dockerignore excludes the whole
# `ops/` directory from the build context) — it holds real per-node PSKs
# and must come from the host at run time only. A single scalar anchor
# (not a list) so it can sit alongside each service's other `volumes:`
# entries — YAML has no clean way to merge two sequences via anchors the
# way `<<:` merges mappings.
x-config-volume: &config-volume "./config.yaml:/etc/homecsi/config.yaml:ro"

x-logging: &default-logging
  # Docker log driver limits so a runaway/chatty container cannot fill the
  # host disk via its own captured stdout/stderr. This is independent of, and
  # in addition to, the application-level log rotation described in
  # docs/deployment.md (which covers files the app writes into /data/logs).
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  timescaledb:
    # Pinned tag (never `latest`): TimescaleDB 2.17.x on Postgres 16.
    # Check the release notes before bumping this - a major Postgres version
    # bump needs pg_upgrade or a dump/restore, not just a tag change.
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      # --- Postgres tuning for a modest VPS (assume ~2-4 vCPU / 4-8 GB RAM)
      # running a write-heavy, mostly-append time-series workload. These are
      # deliberately conservative so the DB does not starve the ingest/api
      # containers sharing the same host; revisit if the VPS is bigger. ---
      - -c
      - shared_buffers=512MB
      # shared_buffers: Postgres's own page cache. ~25% of a small VPS's RAM
      # is the usual starting rule of thumb; kept modest to leave room for
      # the OS page cache and sibling containers.
      - -c
      - effective_cache_size=1536MB
      # effective_cache_size: a hint to the planner about total memory
      # (Postgres + OS cache) available for caching; does not itself
      # allocate memory. Helps the planner favor index scans appropriately.
      - -c
      - work_mem=16MB
      # work_mem: per-sort/hash-operation memory. Kept small because many
      # concurrent small queries (ingest writes + debug API reads) can each
      # grab this much; too high risks OOM under concurrency.
      - -c
      - maintenance_work_mem=128MB
      # maintenance_work_mem: used by VACUUM, index builds, and TimescaleDB
      # compression/retention jobs (owned by sibling brief B3's enforcement
      # code) - a bit higher than work_mem since these run less concurrently.
      - -c
      - max_wal_size=2GB
      # max_wal_size: bounds WAL growth between checkpoints. Higher values
      # reduce checkpoint frequency (better write throughput for a
      # continuous-ingest workload) at the cost of more disk used by WAL and
      # a longer crash-recovery replay.
      - -c
      - checkpoint_completion_target=0.9
      # checkpoint_completion_target: spreads checkpoint I/O over most of
      # the checkpoint interval instead of bursting it, smoothing write
      # latency for concurrent ingest.
      - -c
      - synchronous_commit=off
      # synchronous_commit=off: the DB acknowledges a commit before its WAL
      # record is guaranteed flushed to disk. Trades "lose at most the last
      # ~200ms of committed CSI batches on a hard crash" for meaningfully
      # better write throughput - an acceptable trade for telemetry data
      # that is regenerable-ish (see docs/deployment.md backup section);
      # do NOT use this setting for data you cannot afford to ever lose.
      - -c
      - random_page_cost=1.1
      # random_page_cost=1.1: tells the planner storage is SSD-like (most
      # VPS block storage is), so it doesn't over-penalize index scans the
      # way the historical spinning-disk default (4.0) would.
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Intentionally NOT published to the host - reachable only on the
    # internal `homecsi` compose network. See ops/docker-compose.override.example.yml
    # for a local-dev variant that publishes it to 127.0.0.1 for inspection.
    deploy:
      resources:
        limits:
          # Matches the "modest VPS" assumption in this service's own
          # `command:` tuning comments above (shared_buffers=512MB etc.) -
          # a hard ceiling so a runaway query/connection storm cannot starve
          # the ingest/api containers sharing this host. Raise alongside
          # the `-c` tuning flags above if you provision a bigger VPS (see
          # docs/deployment.md "VPS Sizing").
          cpus: "2.0"
          memory: 3G
    networks:
      - homecsi
    logging: *default-logging

  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    image: homecsi-server:${HOMECSI_IMAGE_TAG:-local}
    # Just the subcommand: the image's exec-form ENTRYPOINT already supplies
    # `node packages/cli/dist/index.js`, and a compose `command:` is APPENDED
    # to an exec-form ENTRYPOINT rather than replacing it. Repeating the
    # interpreter here would produce `node ... index.js node ... index.js
    # migrate`, and commander would reject `node` as an unknown subcommand.
    command: ["migrate"]
    environment: *app-env
    volumes:
      - *config-volume
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          # One-shot and short-lived; a generous cap that only guards
          # against a genuinely runaway process, not a tuned budget.
          cpus: "1.0"
          memory: 512M
    networks:
      - homecsi
    logging: *default-logging

  ingest:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    image: homecsi-server:${HOMECSI_IMAGE_TAG:-local}
    command: ["ingest"] # subcommand only - see the migrate service above
    restart: unless-stopped
    environment: *app-env
    ports:
      # UDP - this is the world-reachable CSI ingest port. See
      # ops/hardening/harden.sh and docs/deployment.md for why an
      # unauthenticated-looking public UDP port is an acceptable exposure
      # here (every datagram is AEAD-authenticated per docs/protocol.md).
      - "${HOMECSI_UDP_PORT:-5566}:${HOMECSI_UDP_PORT:-5566}/udp"
    volumes:
      - ${HOMECSI_DATA_DIR}:/data
      - *config-volume
    depends_on:
      migrate:
        condition: service_completed_successfully
    # No `healthcheck:` here on purpose: ingest is a UDP-only process with
    # no HTTP (or any request/response) surface to probe, so there is no
    # honest liveness check to write - a healthcheck that just checks "is
    # the process running" would tell Docker nothing `restart:
    # unless-stopped` doesn't already handle, and a healthcheck that opens
    # its own UDP socket to itself would test the healthcheck's own
    # networking, not ingest's. `restart: unless-stopped` (a crashed
    # process exits non-zero and gets restarted) is the honest tool for
    # this service - do not invent a fake HTTP endpoint here just to have
    # a green checkmark in `docker compose ps`.
    deploy:
      resources:
        limits:
          # See docs/deployment.md "VPS Sizing" - ingest's own CPU cost is
          # low (a handful of AEAD opens/sec even at 9 nodes); this is
          # headroom against a bug (e.g. a decode loop), not a tuned budget.
          cpus: "1.0"
          memory: 512M
    networks:
      - homecsi
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    image: homecsi-server:${HOMECSI_IMAGE_TAG:-local}
    command: ["serve"] # subcommand only - see the migrate service above
    restart: unless-stopped
    environment: *app-env
    volumes:
      - ${HOMECSI_DATA_DIR}:/data
      - *config-volume
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # No curl/wget in the node:20-bookworm-slim runtime image (see
      # ops/Dockerfile) - use Node's own built-in `fetch` instead of adding
      # a package just for this. Exec form (no shell) so quoting the JS is
      # simple and no `/bin/sh` dependency is introduced either.
      # `/healthz` (server/packages/api/src/routes/health.ts) is
      # deliberately unauthenticated and reports both process liveness and
      # DB reachability - exit 0 only on HTTP 200 (dbReachable === true).
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # No `ports:` here on purpose - the debug API/UI is only reached through
    # caddy's TLS reverse proxy on the `homecsi` network, never directly.
    networks:
      - homecsi
    logging: *default-logging

  # Backstop for the training-set preservation sweep (see
  # docs/architecture.md "Data lifecycle" and docs/deployment.md
  # "Scheduling the training-set preservation sweep"). Labelled sessions'
  # raw per-link features are only copied into `training_features` when a
  # label session is stopped cleanly - without something running `label
  # preserve` on a schedule, a session left open (or whose stop-path
  # preservation attempt failed) silently loses its data at the 7-day
  # `features` retention window (migration 007). This runs entirely inside
  # one long-lived container using the same image as `ingest`/`api` -
  # deliberately NOT `docker compose run` from a host cron job, so the
  # schedule is part of `docker compose up -d` itself and does not depend
  # on the operator separately remembering to install a host-level cron
  # entry (see the systemd path's `.timer` unit for the equivalent there).
  label-preserve:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    image: homecsi-server:${HOMECSI_IMAGE_TAG:-local}
    # Overrides the image's `ENTRYPOINT ["node", "packages/cli/dist/index.js"]`
    # entirely (compose `entrypoint:` replaces, unlike `command:` which
    # appends) so this service can run a scheduling loop around the CLI
    # instead of a single CLI invocation. There is no cron daemon in the
    # node:20-bookworm-slim runtime image (see ops/Dockerfile) and adding
    # one is unnecessary complexity for "run this one command once a day" -
    # a plain shell loop with `sleep` is the honest, minimal tool.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[label-preserve] running at $$(date -u +%FT%TZ)";
          if node packages/cli/dist/index.js label preserve; then
            echo "[label-preserve] ok at $$(date -u +%FT%TZ)";
          else
            echo "[label-preserve] FAILED (exit $$?) at $$(date -u +%FT%TZ)" >&2;
          fi
          sleep 86400;
        done
    restart: unless-stopped
    environment: *app-env
    volumes:
      - *config-volume
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - homecsi
    logging: *default-logging

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HOMECSI_DOMAIN: ${HOMECSI_DOMAIN}
      HOMECSI_ACME_EMAIL: ${HOMECSI_ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        # Waits for api's own `healthcheck:` to report healthy, not just
        # "started" - a bare `depends_on: [api]` only orders container
        # start, so Caddy could start (and start proxying/ACME-issuing)
        # against an api container that is up but not yet listening (or
        # listening but unable to reach the database yet).
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - homecsi
    logging: *default-logging

networks:
  homecsi:
    driver: bridge

volumes:
  timescaledb_data:
  caddy_data:
  caddy_config:
