name: CI

# Triggers: push to main, pull requests targeting main, and manual dispatch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Principle of least privilege: neither job writes anything (no push, comment,
# publish, or tag operations). An explicit permissions block ensures the
# workflow's blast radius is not silently widened if the repository's default
# GITHUB_TOKEN permission setting is ever changed.
permissions:
  contents: read

jobs:
  server:
    # TypeScript/npm workspaces monorepo: build, typecheck, lint, test
    # CLAUDE.md requires all four gates to pass at all times on main.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Cache npm dependencies via package-lock.json at server/ (the npm
          # workspaces root). This is populated by npm ci, not install, to
          # ensure reproducible builds from lock file.
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: npm ci
        working-directory: server
        run: npm ci

      - name: npm run build
        working-directory: server
        run: npm run build

      - name: npm run typecheck
        working-directory: server
        run: npm run typecheck

      - name: npm run lint
        working-directory: server
        run: npm run lint

      - name: npm run test
        working-directory: server
        run: npm run test

  docker:
    # Build the deployment image and validate the compose file.
    # The brief forbids a Postgres service container: CLAUDE.md requires npm
    # test to never need live infrastructure. The four live-DB tests skip
    # cleanly when their env var is unset. That is the intended CI behaviour.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy .env.example to .env
        # docker compose config interpolates ${POSTGRES_DB} and friends.
        # Without .env, they become empty strings and validation is degraded.
        # We use .env.example as the source to validate the shape with
        # realistic values, not a blank/template file.
        run: cp ops/.env.example ops/.env

      - name: Build Docker image
        # Build from repo root: the build context MUST be the repo root, because
        # npm workspaces need every workspace package.json visible under a common
        # root for `npm ci` to resolve the internal server/packages/* deps. The
        # image copies server/ only -- firmware/, ops/ and docs/ are excluded by
        # .dockerignore. ops/docker-compose.yml sets build.context: .. for the
        # same reason, and the Dockerfile lives at the repo root because
        # Coolify's build pack offers only a Base Directory (see its header).
        run: docker build -f Dockerfile -t homecsi-ci .

      - name: Smoke-test the image entrypoint
        # Cheap guard on docker-entrypoint.sh, which is what makes one image
        # serve two roles (see its header and docs/deployment.md section 1).
        # Passing an argument takes the passthrough branch, so this reaches the
        # CLI without needing a config file or a database -- and it fails loudly
        # if the script is not executable, or has CRLF endings (a CRLF shebang
        # makes the kernel hunt for an interpreter named "/bin/sh\r" and report
        # "no such file or directory" about a path that plainly exists).
        run: |
          docker run --rm homecsi-ci --help | grep -q 'run the UDP ingest server'
          # curl is not a convenience here - Coolify's healthcheck shells out to
          # it inside the container, and without it every deployment rolls back
          # while the application itself is healthy. See the Dockerfile.
          docker run --rm --entrypoint curl homecsi-ci --version

      - name: Validate docker-compose.yml
        run: docker compose -f ops/docker-compose.yml config

      - name: Validate docker-compose.coolify.yml
        # The Coolify deployment path's compose file (docs/deployment.md).
        # Validated here for the same reason as the one above: this repo has a
        # documented history of ops/ drifting from the code it configures, and
        # an unvalidated second compose file is exactly how that resumes.
        run: docker compose -f ops/docker-compose.coolify.yml config

  firmware:
    # Host tests for the firmware's hardware-independent sources. No ESP32 and
    # no ESP-IDF involved: firmware/tests compiles the SAME files the firmware
    # build compiles, with a plain host C compiler (see its Makefile header).
    #
    # This job exists so the two-implementation agreements this repo leans on
    # are enforced mechanically instead of by whoever remembers to run the
    # suite locally:
    #   - test_device_token.c and server's packages/api deviceAuth.test.ts
    #     hardcode the SAME device-token golden vector, which is the only
    #     thing proving server and firmware derive an identical bearer token
    #     (docs/device-api.md). A silent divergence here means every node
    #     fails OTA auth in the field.
    #   - test_docs_example.c and packages/protocol's docs-example.test.ts
    #     check docs/protocol.md's worked example from two languages.
    #   - test_version_sync.c fails if main/app_version.h and CMake's
    #     PROJECT_VER disagree, which the OTA anti-flap check depends on.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run firmware host tests
        # run_tests.py (not make) because it is the runner that works on every
        # dev box including Windows on ARM64; it picks up $CC, else cc/gcc/clang,
        # all of which ubuntu-latest already has.
        working-directory: firmware/tests
        run: python3 run_tests.py
